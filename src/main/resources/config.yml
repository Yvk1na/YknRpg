rpg:
  enabled: true
  tick-interval: 10
  # 同时发送聊天提示，避免技能反馈被 AuraSkills 或 HUD 的 ActionBar 覆盖。
  feedback-in-chat: true
  combat:
    base-melee-damage: 5.0
    melee-damage-scale: 0.1
    skill-damage-scale: 0.1
    defense-enabled: true
    defense-cap: 10000.0
    player-skill-damage: false
  health:
    # 1 点 SkyBlock 生命对应多少点 Minecraft 生命值。
    value-scale: 0.05
  shield:
    # 武器技能护盾默认持续秒数；单个 ABSORPTION 效果可用 duration 覆盖。
    default-duration: 10.0

