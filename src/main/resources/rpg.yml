# YknRpg SkyBlock 引擎。当前内容按 MythicMobs 物品 ID 配置。
# 物品键必须与 MythicMobs 物品 ID 完全一致。
# 提升 content-revision 会在启动时备份并替换旧能力配置。
content-revision: 13
schema-version: 1

# 支持属性：damage、strength、crit-chance、crit-damage、attack-speed、health、
# defense、wisdom、ability-damage、ferocity、vitality、mending、speed。
# 支持槽位：ANY、MAIN_HAND、OFF_HAND、HEAD、CHEST、LEGS、FEET。
# 支持触发：RIGHT_CLICK、SNEAK_RIGHT_CLICK、BOW_SHOT、MELEE_HIT、
# PROJECTILE_HIT、KILL、DAMAGED、TICK。
# abilities 中的 mana 直接消耗 AuraSkills 魔力，不使用 YknRpg 独立法力池。
# 支持效果：DAMAGE、HEAL、POTION、TELEPORT、DASH、PROJECTILE、KNOCKBACK、
# LIGHTNING、PARTICLE、SOUND、ABSORPTION、CLEANSE、STAT_BUFF。
