name: YknRpg
version: '${version}'
main: cn.yknrpg.YknRpgPlugin
api-version: '1.21.11'
authors: [ykn]
description: 使用 AuraSkills 法力的 MythicMobs SkyBlock 属性、技能、套装与配方引擎
depend: [MythicMobs, AuraSkills]
softdepend: [CraftEngine, ProtocolLib, EcoPets]
loadbefore: [Skyblock-Core]
provides: [YknItems]
commands:
  yknrpg:
    description: 打开 YknRpg 管理界面或重载配置
    usage: /yknrpg admin <items|weapon|armor|pets|fishing|mining>、/yknrpg edit、/yknrpg monsters 或 /yknrpg reload
    aliases: [yknitems]
permissions:
  yknrpg.admin.monsters:
    description: 允许管理自定义怪物掉落物
    default: op
  yknrpg.admin:
    description: 允许打开管理员物品图鉴、编辑单件物品属性与重载 YknRpg
    default: op
  yknitems.admin:
    description: 旧版 YknItems 管理权限兼容节点
    default: false
    children:
      yknrpg.admin: true
      yknrpg.admin.monsters: true
