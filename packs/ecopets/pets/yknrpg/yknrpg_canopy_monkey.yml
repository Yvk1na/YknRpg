level-up-effects: []

effects:
  - id: add_stat
    args:
      stat: strength
      amount: "%level% * 0.2"
  - id: add_stat
    args:
      stat: luck
      amount: "%level% * 0.12"
  - id: add_stat
    args:
      stat: speed
      amount: "%level% * 0.06"
  - id: multiply_drops
    args:
      multiplier: 2
      chance: "%level% * 0.1"
      on_items:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem
    triggers:
      - block_item_drop
    filters:
      player_placed: false
      blocks:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem
  - id: skill_xp_multiplier
    args:
      multiplier: "1 + (%level% * 0.0009)"
      skills:
        - foraging

conditions: []
activate-conditions: []

