xp-formula: "(%level% * %level% * 17) + (%level% * 85)"
max-level: 100

xp-gain-methods:
  - id: mine_block
    value: 3
    filters:
      player_placed: false
      blocks:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem

level-placeholders:
  - id: "strength_bonus"
    value: "%level% * 0.2"
  - id: "luck_bonus"
    value: "%level% * 0.12"
  - id: "speed_bonus"
    value: "%level% * 0.06"
  - id: "perk_log_double_chance"
    value: "%level% * 0.1"
  - id: "perk_foraging_xp"
    value: "%level% * 0.09"

effects-description:
  1:
    - "&7属性加成："
    - "&c+%strength_bonus% 力量"
    - "&a+%luck_bonus% 幸运"
    - "&f+%speed_bonus% 速度"
    - "&d【树冠丰收】&7天然原木双倍掉落概率 &a%perk_log_double_chance%%"
    - "&d【灵猴采枝】&7伐木技能经验 &a+%perk_foraging_xp%%"
    - ""
    - "&5史诗宠物"

rewards-description:
  1:
    - "&c+%strength_bonus% 力量"
    - "&a+%luck_bonus% 幸运"
    - "&f+%speed_bonus% 速度"
    - "&d【树冠丰收】&7天然原木双倍掉落概率 &a%perk_log_double_chance%%"
    - "&d【灵猴采枝】&7伐木技能经验 &a+%perk_foraging_xp%%"

level-up-messages:
