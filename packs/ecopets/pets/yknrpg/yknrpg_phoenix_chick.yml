    - "&d【涅槃余烬】&7自动熔炼天然铁、金、铜矿石"

level-up-effects: []

effects:
  - id: add_stat
    args:
      stat: regeneration
      amount: "%level% * 0.16"
  - id: add_stat
    args:
      stat: wisdom
      amount: "%level% * 0.07"
  - id: add_stat
    args:
      stat: health
      amount: "%level% * 0.02"
  - id: pet_xp_multiplier
    args:
      multiplier: "1 + (%level% * 0.001)"
  - id: autosmelt
    args:
      drop_xp: true
    triggers:
      - block_item_drop
    filters:
      player_placed: false
      blocks:
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - copper_ore
        - deepslate_copper_ore

conditions: []
activate-conditions: []

spawn-egg:
  enabled: true
  item: chicken_spawn_egg unbreaking:1 hide_enchants
  name: "&5涅槃雏凰 &f宠物蛋"
  lore:
    - ""
    - "&7放置到地面以解锁 &5涅槃雏凰&7。"
    - "&7收回后保留当前等级与经验。"
  craftable: false
  recipe: []
