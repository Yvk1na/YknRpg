xp-formula: "(%level% * %level% * 17) + (%level% * 85)"
max-level: 100

xp-gain-methods:
  - id: kill
    multiplier: 0.55
    filters:
      not_entities:
        - player
        - armor_stand

level-placeholders:
  - id: "regeneration_bonus"
    value: "%level% * 0.16"
  - id: "wisdom_bonus"
    value: "%level% * 0.07"
  - id: "health_bonus"
    value: "%level% * 0.02"
  - id: "perk_pet_xp"
    value: "%level% * 0.1"

effects-description:
  1:
    - "&7属性加成："
    - "&d+%regeneration_bonus% 再生"
    - "&b+%wisdom_bonus% 智慧"
    - "&c+%health_bonus% 生命"
    - "&d【浴火成长】&7宠物经验 &a+%perk_pet_xp%%"
    - "&d【涅槃余烬】&7自动熔炼天然铁、金、铜矿石"
    - ""
    - "&5史诗宠物"

rewards-description:
  1:
    - "&d+%regeneration_bonus% 再生"
    - "&b+%wisdom_bonus% 智慧"
    - "&c+%health_bonus% 生命"
    - "&d【浴火成长】&7宠物经验 &a+%perk_pet_xp%%"
    - "&d【涅槃余烬】&7自动熔炼天然铁、金、铜矿石"

level-up-messages:
  1:
    - "&d+%regeneration_bonus% 再生"
    - "&b+%wisdom_bonus% 智慧"
    - "&c+%health_bonus% 生命"
