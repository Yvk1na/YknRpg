  - id: add_stat
    args:
      stat: speed
      amount: "%level% * 0.036"
  - id: multiply_drops
    args:
      multiplier: 2
      chance: "%level% * 0.06"
      on_items:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem
    triggers:
      - block_item_drop
    filters:
