      blocks:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem
  - id: skill_xp_multiplier
    args:
      multiplier: "1 + (%level% * 0.0007)"
      skills:
        - foraging

conditions: []
activate-conditions: []

