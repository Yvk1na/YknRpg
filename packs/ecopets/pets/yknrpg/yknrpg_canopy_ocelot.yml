    - "&e豹猫身法 &7伐木技能经验 +&a%perk_foraging_xp%%"
    - ""
    - "&9稀有宠物"

rewards-description:
  1:
    - "&c+%strength_bonus% 力量"
    - "&f+%speed_bonus% 速度"
