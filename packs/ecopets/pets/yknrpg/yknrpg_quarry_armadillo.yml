entity-texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzFlYjZkZjQ3MzZhZTI0ZGQxMmEzZDAwZjkxZTZlM2FhN2FkZTZiYmVmYjA5NzhhZmVmMmYwZjkyNDYxMDE4ZiJ9fX0="
