xp-gain-methods:
  - id: mine_block
    value: 2
    filters:
      player_placed: false
      blocks:
        - oak_log
        - spruce_log
        - birch_log
        - jungle_log
        - acacia_log
        - dark_oak_log
        - mangrove_log
        - cherry_log
        - pale_oak_log
        - crimson_stem
        - warped_stem

level-placeholders:
  - id: "regeneration_bonus"
    value: "%level% * 0.04"
  - id: "perk_foraging_xp"
    value: "%level% * 0.03"

effects-description:
  1:
    - "&7属性加成："
    - "&d+%regeneration_bonus% 再生"
    - ""
    - "&6特殊效果："
    - "&e林间本能 &7伐木经验 +&a%perk_foraging_xp%%"
    - ""
    - "&8普通宠物"

rewards-description:
  1:
    - "&d+%regeneration_bonus% 再生"
    - "&e林间本能 &7伐木经验 +&a%perk_foraging_xp%%"

level-up-messages:
