    args:
      stat: regeneration
      amount: "%level% * 0.04"
  - id: skill_xp_multiplier
    args:
      multiplier: "1 + (%level% * 0.0003)"
      skills:
        - foraging

conditions: []
activate-conditions: []

spawn-egg:
