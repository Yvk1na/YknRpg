      stat: health
      amount: "%level% * 0.04"
  - id: add_stat
    args:
      stat: toughness
      amount: "%level% * 0.27"
  - id: add_stat
    args:
      stat: luck
      amount: "%level% * 0.15"
  - id: multiply_drops
    args:
      multiplier: 2
      chance: "%level% * 0.12"
      on_items:
