xp-formula: "(%level% * %level% * 10) + (%level% * 50)"
max-level: 100

xp-gain-methods:
  - id: mine_block
    value: 2.25
    filters:
      player_placed: false
      blocks:
        - stone
        - deepslate
        - coal_ore
        - deepslate_coal_ore
        - copper_ore
        - deepslate_copper_ore
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - redstone_ore
        - deepslate_redstone_ore
        - lapis_ore
        - deepslate_lapis_ore
        - diamond_ore
        - deepslate_diamond_ore
        - emerald_ore
        - deepslate_emerald_ore
        - nether_quartz_ore
        - nether_gold_ore
        - ancient_debris

level-placeholders:
  - id: "wisdom_bonus"
    value: "%level% * 0.05"
  - id: "speed_bonus"
    value: "%level% * 0.02"

effects-description:
  1:
    - "&7属性加成："
    - "&b+%wisdom_bonus% 智慧"
    - "&f+%speed_bonus% 速度"
    - ""
    - "&a少见的宠物"

rewards-description:
  1:
    - "&b+%wisdom_bonus% 智慧"
    - "&f+%speed_bonus% 速度"

level-up-messages:
  1:
    - "&b+%wisdom_bonus% 智慧"
    - "&f+%speed_bonus% 速度"

level-up-effects: []

effects:
  - id: add_stat
    args:
      stat: wisdom
      amount: "%level% * 0.05"
  - id: add_stat
    args:
      stat: speed
      amount: "%level% * 0.02"

conditions: []
activate-conditions: []

spawn-egg:
  enabled: true
  item: bat_spawn_egg unbreaking:1 hide_enchants
  name: "&a洞穴蝙蝠 &f宠物蛋"
  lore:
    - ""
    - "&7放置到地面以解锁 &a洞穴蝙蝠&7。"
    - "&7收回后保留当前等级与经验。"
  craftable: false
  recipe: []
  recipe-permission: ecopets.craft.yknrpg_cave_bat
  withdrawable: true
