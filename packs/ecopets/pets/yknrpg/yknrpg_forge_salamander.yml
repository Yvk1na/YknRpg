    args:
      stat: toughness
      amount: "%level% * 0.18"
  - id: add_stat
    args:
      stat: wisdom
      amount: "%level% * 0.048"
  - id: autosmelt
    args:
      drop_xp: true
    triggers:
      - block_item_drop
    filters:
      player_placed: false
      blocks:
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - copper_ore
        - deepslate_copper_ore
  - id: skill_xp_multiplier
    args:
      multiplier: "1 + (%level% * 0.0007)"
      skills:
        - mining

conditions: []
activate-conditions: []

