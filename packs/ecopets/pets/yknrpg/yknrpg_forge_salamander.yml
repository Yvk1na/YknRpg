    value: "%level% * 0.18"
  - id: "wisdom_bonus"
    value: "%level% * 0.048"
  - id: "perk_mining_xp"
    value: "%level% * 0.07"

effects-description:
  1:
    - "&7属性加成："
    - "&7+%toughness_bonus% 韧性"
    - "&b+%wisdom_bonus% 智慧"
    - ""
    - "&6特殊效果："
    - "&e熔炉吐息 &7自动熔炼天然铁、金与铜矿石"
    - "&e炽热研习 &7采矿技能经验 +&a%perk_mining_xp%%"
    - ""
    - "&9稀有宠物"

rewards-description:
  1:
    - "&7+%toughness_bonus% 韧性"
    - "&b+%wisdom_bonus% 智慧"
    - "&e熔炉吐息 &7自动熔炼天然铁、金与铜矿石"
    - "&e炽热研习 &7采矿技能经验 +&a%perk_mining_xp%%"

level-up-messages:
