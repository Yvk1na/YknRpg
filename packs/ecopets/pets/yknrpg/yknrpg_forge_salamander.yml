      blocks:
        - coal_ore
        - deepslate_coal_ore
        - copper_ore
        - deepslate_copper_ore
        - iron_ore
        - deepslate_iron_ore
        - gold_ore
        - deepslate_gold_ore
        - redstone_ore
        - deepslate_redstone_ore
